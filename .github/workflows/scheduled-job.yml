name: Scheduled Tasks

on:
  schedule:
    # Runs at 05:30 UTC every day
    - cron: '30 5 * * *'
  workflow_dispatch: # Allows you to also trigger this job manually via the GitHub UI

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Build and Run Gradle Tests
      run: ./gradlew build

    - name: Upload Gradle Bundle Artifact
      uses: actions/upload-artifact@v6
      with:
        name: gradle-build-output
        path: build/
        retention-days: 1


  HRDPS00Z-003-048:
    runs-on: ubuntu-latest
    needs: build
    env:
      TZ: 'America/Toronto'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Download Build Artifacts
      uses: actions/download-artifact@v7
      with:
        name: gradle-build-output
        path: build/

    - name: Process HRDPS
      timeout-minutes: 20
      run: |
        xvfb-run --auto-servernum ./gradlew \
        run --args="$(tr '\n' ' ' < test/grid/HRDPS.txt) \
        begin=3 end=48 step=3 PREFIX=5"

    - name: Setup FFmpeg
      uses: FedericoCarboni/setup-ffmpeg@v3
      id: setup-ffmpeg

    - name: Create video output
      run: |
        outDir=$(ls output)
        cd output
        cd "${outDir}"
        ffmpeg -framerate 10 -pattern_type glob -i "*.png" -c:v libx264 -pix_fmt yuv420p ../"${outDir}".mp4

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: HRDPS00Z-003-048-output
        path: output/*.mp4
        if-no-files-found: error
        compression-level: 0
        retention-days: 2


