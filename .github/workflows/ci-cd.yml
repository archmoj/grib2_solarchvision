name: Java CI with Gradle

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Build and Run Gradle Tests
      run: ./gradlew build

    - name: Upload Gradle Bundle Artifact
      uses: actions/upload-artifact@v6
      with:
        name: gradle-build-output
        path: build/
        retention-days: 1

  test-GFS:
    runs-on: ubuntu-latest
    needs: build
    env:
      TZ: 'America/Winnipeg'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Download Build Artifacts
      uses: actions/download-artifact@v7
      with:
        name: gradle-build-output
        path: build/

    - name: Test GFS
      timeout-minutes: 5
      run: xvfb-run --auto-servernum ./gradlew run --args="$(tr '\n' ' ' < test/grid/GFS.txt)"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: GFS-output
        path: output/
        retention-days: 1

