name: Java CI with Gradle

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies (Xvfb & OpenGL)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libpango1.0-dev libglu1-mesa-dev

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Build and Run Gradle Tests
      run: ./gradlew build

    - name: Test HRDPS
      timeout-minutes: 2
      run: xvfb-run --auto-servernum ./gradlew run --args="$(tr '\n' ' ' < test/grid/HRDPS.txt)"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Output-files
        path: output/

